# Bouwt de site met Eleventy en zet hem online op GitHub Pages.
# Dit gebeurt automatisch:
#  - bij elke push of merge naar de branch main;
#  - elke nacht, zodat voorbije retraites vanzelf van de site verdwijnen
#    (welke retraites "komend" zijn, wordt bij het bouwen bepaald).
name: Publiceren op GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # elke nacht om 03:00 UTC (04:00 of 05:00 in Nederland)
  workflow_dispatch: # ook handmatig te starten via het tabblad Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Haalt het pad van de site op (bijv. /ClaudeCode) zodat alle links kloppen.
      - id: pages
        uses: actions/configure-pages@v6

      - run: npx @11ty/eleventy --pathprefix="${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publiceren:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
