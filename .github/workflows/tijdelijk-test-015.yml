# TIJDELIJK: test de acceptatiecriteria van story 015. Wordt na de test verwijderd.
name: Tijdelijke test story 015
on:
  push:
    branches: [story/015-021-concepten]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          npx @11ty/eleventy --pathprefix=/ClaudeCode/ 2>&1 | grep -v Deprecation | grep -v Benchmark
          for f in $(find _site -name "*.html"); do if grep -q "<pre>\|&lt;span\|&lt;li\|{{\|{%" $f; then echo "RUWE CODE IN $f"; exit 1; fi; done
      - name: "015 Voorwaarden"
        run: |
          V=_site/voorwaarden/index.html
          sed -n '/<main/,/<\/main>/p' $V | sed 's/^ *//' | grep -v '^$'
          ! grep -qi "in de maak" $V
          sed -n '/<main/,/<\/main>/p' $V | grep -o '<h2[^>]*>[^<]*' | sed 's/<h2[^>]*>//' > koppen.txt; cat koppen.txt
          diff koppen.txt <(printf '%s\n' "Aanmelden is een aanvraag" "Betalen" "Annuleren door jou" "Annuleren of wijzigen door ons")
          grep -q 'class="melding" role="note"><strong>Concept</strong>' $V
          grep -q "<table>" $V && grep -q "<th>Wanneer je annuleert</th>" $V && test "$(grep -c '<tr>' $V)" = "4"
          test "$(grep -c 'class="volgt">termijn volgt' $V)" = "2"
          grep -q "€ 100" $V
          grep -q 'class="pagina__bijgewerkt">Laatst bijgewerkt: 3 november 2026' $V
          # andere pagina's zonder concept/bijgewerkt blijven ongewijzigd
          ! grep -q "<strong>Concept</strong>\|pagina__bijgewerkt" _site/contact/index.html _site/wat-en-waarom/index.html
      - name: Bundel voor browsertest
        run: |
          echo "SITE-BEGIN"; tar czf - _site | base64 -w0; echo; echo "SITE-EINDE"
      - name: "Variant: concept uit"
        run: |
          sed -i 's/^concept: true/concept: false/' src/voorwaarden.md
          npx @11ty/eleventy 2>&1 | tail -1
          ! grep -q "<strong>Concept</strong>" _site/voorwaarden/index.html
          echo "concept uit OK"
