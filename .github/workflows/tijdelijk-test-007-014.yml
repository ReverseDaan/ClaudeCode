# TIJDELIJK: test de acceptatiecriteria van story 007-014. Wordt na de test verwijderd.
name: Tijdelijke test story 007-014
on:
  push:
    branches: [story/007-014]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install --quiet icalendar
      - name: Basisbuild
        run: |
          npx @11ty/eleventy --pathprefix=/ClaudeCode/ 2>&1 | grep -v Deprecation | grep -v Benchmark
          find _site -type f \( -name "*.html" -o -name "*.ics" \) | sort
          for f in $(find _site -name "*.html"); do if grep -q "<pre>\|&lt;li\|&lt;ul\|&lt;details\|{{\|{%" $f; then echo "RUWE CODE IN $f"; exit 1; fi; done
          echo "geen ruwe code in de HTML"
      - name: "007 Contact"
        run: |
          sed -n '/<main/,/<\/main>/p' _site/contact/index.html > c.html; cat c.html
          grep -q 'href="mailto:stillnessandstrokes@gmail.com"' c.html
          ! grep -qi "in de maak\|instagram\|facebook\|tel:\|06 " c.html
      - name: "008 Eventpagina"
        run: |
          E=_site/retraites/2027-04-voorjaar/index.html
          sed -n '/<main/,/<\/main>/p' $E | sed 's/^ *//' | grep -v '^$'
          grep -q "<title>Voorjaarsretraite · Stillness and Strokes</title>" $E
          grep -q "25 – 29 april 2027" $E && grep -q "Zonnehuis, Loenen" $E && grep -q "€ 495" $E && grep -q "Plekken vrij" $E
          grep -q "Vier overnachtingen" $E && grep -q "Daan Smit" $E && grep -q "Vincent Nieuwenhuis" $E
          test "$(grep -c '<summary>' $E)" = "3"
          grep -q "Na je aanmelding ontvang je informatie over de bereikbaarheid" $E
          grep -q 'href="/ClaudeCode/aanmelden/#2027-04-voorjaar"' $E
          grep -q "Comfortabele kleding" $E
          grep -q 'href="/ClaudeCode/retraites/2027-04-voorjaar/"' _site/retraites/index.html _site/kalender/index.html _site/aanmelden/index.html
          echo "008 basis OK"
      - name: "009 Agenda"
        run: |
          I=_site/retraites/2027-04-voorjaar.ics; cat -A $I | head -12
          grep -q $'\r$' $I
          python3 -I - "$I" <<'PY'
          import sys, icalendar
          cal = icalendar.Calendar.from_ical(open(sys.argv[1],'rb').read())
          ev = [c for c in cal.walk('VEVENT')]
          assert len(ev)==1, len(ev)
          e=ev[0]
          print("SUMMARY:", e['SUMMARY']); print("START:", e['DTSTART'].dt, "EIND:", e['DTEND'].dt); print("LOCATION:", e['LOCATION'])
          assert str(e['DTSTART'].dt)=="2027-04-25" and str(e['DTEND'].dt)=="2027-04-30"
          assert "Zonnehuis" in str(e['LOCATION'])
          assert "/retraites/2027-04-voorjaar/" in str(e['URL'])
          print("ics geldig")
          PY
          grep -q 'href="/ClaudeCode/retraites/2027-04-voorjaar.ics" download' _site/retraites/2027-04-voorjaar/index.html
      - name: "013 Vragen"
        run: |
          V=_site/vragen/index.html
          test "$(sed -n '/<main/,/<\/main>/p' $V | grep -o '<h2[^>]*>[^<]*' | sed 's/<h2[^>]*>//' | tr '\n' '|')" = "Meedoen|Tijdens de retraite|Praktisch|Aanmelden en betalen|"
          test "$(grep -c '<summary>' $V)" = "14"
          grep -q 'href="/ClaudeCode/vragen/">Veelgestelde vragen' _site/index.html
          grep -q 'href="/ClaudeCode/vragen/"' _site/aanmelden/index.html && grep -q 'href="/ClaudeCode/vragen/"' _site/contact/index.html
          ! grep -q 'href="/ClaudeCode/vragen/"' <(sed -n '/<nav id="hoofdmenu"/,/<\/nav>/p' _site/index.html)
          echo "013 OK"
      - name: "010 Ervaringen en 012 Past het bij mij"
        run: |
          test "$(grep -c 'class="ervaring"' _site/index.html)" = "4"
          test "$(grep -c 'class="ervaring"' _site/wat-en-waarom/index.html)" = "4"
          grep -q "Wat deelnemers zeggen" _site/index.html
          ! grep -qi "karin" _site/index.html _site/wat-en-waarom/index.html
          W=_site/wat-en-waarom/index.html
          test "$(sed -n '/class="past-bij-mij"/,/<\/section>/p' $W | grep -c '<summary>')" = "4"
          grep -q "Ik kan niet schilderen. Kan ik meedoen?" $W
          sed -n '/class="past-bij-mij"/,/<\/section>/p' $W | grep -q 'href="/ClaudeCode/contact/"'
          sed -n '/class="past-bij-mij"/,/<\/section>/p' $W | grep -q 'href="/ClaudeCode/retraites/"'
          echo "010 en 012 OK"
      - name: "014 Interesselijst leeg = verborgen"
        run: |
          ! grep -rl 'class="interesselijst"' _site
          echo "014: zonder url nergens zichtbaar"
      - name: Bundel voor browsertest
        run: |
          echo "SITE-BEGIN"; tar czf - _site | base64 -w0; echo; echo "SITE-EINDE"
      - name: "Varianten: extra items, verleden, bereikbaarheid, url ingevuld"
        run: |
          sed -i 's|^  url: ""|  url: "https://forms.gle/voorbeeld"|' src/_data/site.yaml
          printf '\n- tekst: "Vijfde testquote."\n  bron: "Deelnemer, test"\n' >> src/_data/ervaringen.yaml
          printf '\n    - vraag: "Testvraag?"\n      antwoord: "Testantwoord."\n' >> src/_data/vragen.yaml
          sed -e 's/titel: "Voorjaarsretraite"/titel: "Najaar"/' -e 's/start: 2027-04-25/start: 2027-10-01/' -e 's/eind: 2027-04-29/eind: 2027-10-03/' -e 's|^# bereikbaarheid: .*|bereikbaarheid: "Met de trein tot station Test."|' src/retraites/2027-04-voorjaar.md > src/retraites/2027-10-najaar.md
          sed -e 's/titel: "Voorjaarsretraite"/titel: "Oud"/' -e 's/start: 2027-04-25/start: 2020-04-25/' -e 's/eind: 2027-04-29/eind: 2020-04-29/' src/retraites/2027-04-voorjaar.md > src/retraites/2020-04-oud.md
          npx @11ty/eleventy 2>&1 | tail -1
          test "$(grep -c 'class="ervaring"' _site/index.html)" = "5"
          test "$(grep -c '<summary>' _site/vragen/index.html)" = "15"
          grep -q "Met de trein tot station Test." _site/retraites/2027-10-najaar/index.html
          test -f _site/retraites/2027-10-najaar.ics && ! test -f _site/retraites/2020-04-oud.ics
          O=_site/retraites/2020-04-oud/index.html
          grep -q "Deze retraite is voorbij" $O && ! grep -q 'class="knop" href="/aanmelden/' $O && ! grep -q "Zet in je agenda" $O
          grep -q 'class="interesselijst"' _site/index.html && grep -q 'class="interesselijst"' _site/retraites/index.html
          grep -q 'href="https://forms.gle/voorbeeld" target="_blank" rel="noopener"' _site/index.html
          grep -q "Afmelden kan altijd" _site/index.html
          rm src/retraites/2027-10-najaar.md
          sed -i -e 's/start: 2027-04-25/start: 2020-04-25/' -e 's/eind: 2027-04-29/eind: 2020-04-29/' src/retraites/2027-04-voorjaar.md
          npx @11ty/eleventy 2>&1 | tail -1
          for f in retraites kalender aanmelden; do grep -q 'class="interesselijst"' _site/$f/index.html && ! grep -q 'retraite-leeg' _site/$f/index.html && echo "$f: interesselijst in de lege staat"; done
          test "$(grep -l 'class="interesselijst"' _site/{retraites,kalender,aanmelden}/index.html | wc -l)" = "3"
          echo "varianten OK"
