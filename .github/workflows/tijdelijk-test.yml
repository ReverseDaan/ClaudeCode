# TIJDELIJK: test de story die nu gebouwd wordt. Wordt na de test verwijderd.
name: Tijdelijke storytest
on:
  push:
    branches: [story/032-ademblok-scrollen]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Test
        run: bash .github/tijdelijk/test.sh
