# TIJDELIJK: test de acceptatiecriteria van de story die nu gebouwd wordt.
# Het testscript staat in .github/tijdelijk/test.sh. Beide worden na de test verwijderd.
name: Tijdelijke storytest
on:
  push:
    branches: [story/015-021-concepten]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: pip install --quiet icalendar
      - name: Test
        run: bash .github/tijdelijk/test.sh
