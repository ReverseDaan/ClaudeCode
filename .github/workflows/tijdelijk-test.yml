# TIJDELIJK: test de story die nu gebouwd wordt. Wordt na de test verwijderd.
name: Tijdelijke storytest
on:
  push:
    branches: [story/023-025-concepten]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: bash .github/tijdelijk/test.sh
