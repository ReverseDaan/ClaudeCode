# TIJDELIJK: test de acceptatiecriteria van story 005 en 006. Wordt na de test verwijderd.
name: Tijdelijke test story 005 en 006
on:
  push:
    branches: [story/005-006-inhoud]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Build en criteria 005"
        run: |
          npx @11ty/eleventy --pathprefix=/ClaudeCode/ 2>&1 | grep -v Deprecation
          W=_site/wat-en-waarom/index.html
          sed -n '/<main/,/<\/main>/p' $W
          echo "--- volgorde koppen:"; grep -o '<h[23][^>]*>[^<]*' $W | sed 's/<h[23][^>]*>//' | tr '\n' '|'; echo
          test "$(grep -o '<h2[^>]*>[^<]*' $W | sed 's/<h2[^>]*>//' | tr '\n' '|')" = "Wat het is|Voor wie|Waarom|Zo kan een dag eruitzien|Begeleiding|" || test "$(grep -o '<h[23][^>]*>[^<]*' $W | sed 's/<h[23][^>]*>//' | grep -v 'Daan Smit\|Vincent Nieuwenhuis' | tr '\n' '|')" = "Wat het is|Voor wie|Waarom|Zo kan een dag eruitzien|Begeleiding|"
          grep -q "<table>" $W && grep -q "<th>Tijd</th>" $W && grep -q "Ontbijt in stilte" $W
          grep -q "Een voorbeeld uit onze eerste retraite" $W
          test "$(grep -c 'class="persoon-kaart"' $W)" = "2"
          grep -q "Daan Smit" $W && grep -q "Vincent Nieuwenhuis" $W && grep -q "Oprichter en begeleider" $W
          grep -q 'persoon-kaart__foto--leeg" aria-hidden="true">D<' $W
          ! grep -q "<pre>\|&lt;li\|&lt;ul\|<code>" $W
          ! grep -qE "06[ -]?[0-9]{2}|\+31" $W
          grep -q "Stillness and Strokes nodigen" $W && ! grep -q "{{" $W
          grep -q 'class="knop" href="/ClaudeCode/retraites/"' $W
          grep -q "maken we binnenkort bekend" $W
      - name: "Criteria 006"
        run: |
          S=_site/stichting/index.html
          sed -n '/<main/,/<\/main>/p' $S
          test "$(grep -o '<h2[^>]*>[^<]*' $S | sed 's/<h2[^>]*>//' | tr '\n' '|')" = "Missie|Hoe het begon|Wie wij zijn|Gegevens|"
          grep -q "Let op: voorbeeldgegevens." $S
          grep -q "12345678" $S && grep -q "123456789" $S && grep -q "Epe" $S
          grep -q "KvK: 12345678 (voorbeeld)" $S && grep -q "KvK: 12345678 (voorbeeld)" _site/index.html
          ! grep -qi "anbi" $S && ! grep -qi "rohit" $S
          ! grep -qE "06[ -]?[0-9]{2}|\+31" $S
          test "$(grep -c 'class="persoon-kaart"' $S)" = "2"
          ! grep -q "<pre>\|&lt;li\|<code>" $S
      - name: "Bundel voor browsertest"
        run: |
          echo "SITE-BEGIN"; tar czf - _site | base64 -w0; echo; echo "SITE-EINDE"
      - name: "006: voorbeeld uit en ANBI aan"
        run: |
          sed -i 's/^voorbeeld: true/voorbeeld: false/; s/^anbi: false/anbi: true/' src/_data/stichting.yaml
          npx @11ty/eleventy 2>&1 | tail -1
          S=_site/stichting/index.html
          ! grep -q "Let op: voorbeeldgegevens" $S && ! grep -q "(voorbeeld)" _site/index.html
          grep -q "ANBI" _site/index.html
          echo "voorbeeld uit: melding en (voorbeeld) weg; ANBI aan: zichtbaar in voettekst"
      - name: "005: derde persoon en echte foto verschijnen vanzelf"
        run: |
          git checkout src/_data/stichting.yaml
          printf '\n- code: "test"\n  naam: "Test Persoon"\n  rol: "Begeleider"\n  bio: "Testbio."\n  foto: "persoon-daan.jpg"\n' >> src/_data/personen.yaml
          mkdir -p src/images && printf '\xff\xd8\xff' > src/images/persoon-daan.jpg
          npx @11ty/eleventy 2>&1 | tail -1
          W=_site/wat-en-waarom/index.html
          test "$(grep -c 'class="persoon-kaart"' $W)" = "3"
          grep -q 'src="/images/persoon-daan.jpg" alt="Foto van Daan Smit"\|src="/ClaudeCode/images/persoon-daan.jpg" alt="Foto van Daan Smit"' $W
          echo "derde persoon en foto OK"
