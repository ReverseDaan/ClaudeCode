<!-- Deelafbeelding (1200 × 630) voor als een link van de site gedeeld wordt
     (WhatsApp, Instagram, mail). Bewust zonder tekst: de naam van de site
     staat in de titel naast de afbeelding en komt uit site.yaml.
     Bron van deelkaart.jpg; pas je deze tekening aan, maak dan opnieuw een
     JPG van 1200 × 630 (of vervang hem door een foto met dezelfde naam). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bos" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#56653a"/>
      <stop offset="1" stop-color="#2f3a1c"/>
    </linearGradient>
    <radialGradient id="gloed" cx="0.3" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7d8b55" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7d8b55" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bos)"/>
  <rect width="1200" height="630" fill="url(#gloed)"/>
  <!-- penseelstreek -->
  <path fill="#d9b066" opacity="0.92" d="M330 318c70-22 150-34 240-36 100-2 190 8 300 2 20-1 40 0 0 8-90 16-180 24-280 28-90 4-170 6-246 10-20 1-34-4-14-12z"/>
  <!-- heuvels -->
  <path fill="#f5efe4" opacity="0.45" d="M0 520c120-36 230 12 360-10 140-24 240 16 380-2 140-18 260 28 460-12V630H0z"/>
  <path fill="#f5efe4" d="M0 566c160-26 300 20 470 6 150-12 290 26 450 14 120-8 200 10 280 4V630H0z"/>
</svg>
