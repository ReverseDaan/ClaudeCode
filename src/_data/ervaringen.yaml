- tekst: "Wat ik mooi vond, was vooral dat het totaal niet ongemakkelijk voelde om niets te zeggen. Dat voelde heel vertrouwd."
  bron: "Deelnemer, eerste retraite (2025)"

- tekst: "Een nieuwe vorm van aandacht … oefening met zachtheid, tijd nemen, oefenen met aandacht."
  bron: "Deelnemer, eerste retraite (2025)"

- tekst: "Het programma was vol genoeg en optioneel, dus je voelde je niet verplicht. Het eten was geweldig!"
  bron: "Deelnemer, eerste retraite (2025)"
