# ------------------------------------------------------------------
# Begeleiders en bestuursleden
# ------------------------------------------------------------------
# Elke persoon begint met een streepje (-). Per persoon:
#  - code:  korte naam zonder spaties. Retraites verwijzen hiernaar
#           (in src/retraites/*.md, bij "begeleiders"). Verander je een
#           code, pas hem dan ook daar aan.
#  - naam:  zoals bezoekers hem zien
#  - rol:   bijv. "Begeleider" of "Bestuurslid"
#  - bio:   twee à drie zinnen
#  - foto:  bestandsnaam in src/images/. Staat het bestand er (nog) niet,
#           dan toont de site een cirkel met de voorletter.
#
# De bio's zijn nog concepten: pas ze gerust aan.
# ------------------------------------------------------------------

- code: "daan"
  naam: "Daan Smit"
  rol: "Begeleider"
  bio: "Meditatie speelt al bijna tien jaar een belangrijke rol in mijn leven. In die tijd is het steeds meer een manier geworden om mezelf beter te leren kennen. Tijdens mijn eigen innerlijke reis ben ik onder andere mijn innerlijke criticus, mijn oordelen en mijn weerstand tegen bepaalde delen van mezelf tegengekomen.

Ik heb ervaren hoe meditatie ruimte kan bieden om daar niet langer alleen tegen te vechten, maar juist bij stil te staan. Om ook de minder mooie, ongemakkelijke of kwetsbare kanten van mezelf onder ogen te zien en ze met wat meer mildheid tegemoet te treden. Soms betekent dat simpelweg dat je jezelf ook op de moeilijkste momenten een knuffel leert geven.

Onlangs heb ik een opleiding tot meditatieleraar afgerond. Vanuit mijn eigen ervaring en nieuwsgierigheid begeleid ik anderen graag bij hun eigen onderzoek. Ik vind het waardevol om samen ruimte te creëren voor verstilling, zelfonderzoek en het ontwikkelen van een vriendelijkere verhouding tot onszelf."
  foto: "persoon-daan.jpg"

- code: "vincent"
  naam: "Vincent Nieuwenhuis"
  rol: "Begeleider"
  # Concept: nog afstemmen met Vincent.
  bio: "Vincent begeleidt de yoga en de stiltewandelingen, en neemt je mee naar buiten om het landschap op je in te laten werken. Hij zorgt ervoor dat de groep zich welkom voelt en dat er een veilige bedding is om te openen voor de gezamenlijke reis."
  foto: "persoon-vincent.jpg"
