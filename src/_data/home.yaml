# ------------------------------------------------------------------
# Teksten van de homepagina, per blok van boven naar beneden.
# Pas de tekst tussen de aanhalingstekens aan; laat de namen
# vóór de dubbele punt (zoals "slogan:") staan.
# ------------------------------------------------------------------

hero:
  # Korte zin onder de naam, bovenaan de pagina.
  slogan: "Vertraag. Maak iets met je handen. Begin de reis naar binnen."
  knop: "Bekijk de retraites"
  # Foto voor de achtergrond: de bestandsnaam in src/images/.
  # Zolang het bestand er niet is, zie je het getekende landschap.
  afbeelding: "hero-retraite-2025.jpg"
  # Kleinere versie (1000 px breed) voor telefoons. Mag leeg blijven.
  afbeeldingKlein: "hero-retraite-2025-klein.jpg"
  # Korte beschrijving van de foto voor wie hem niet kan zien.
  alt: "Een geschilderd portret op een houten ezel in een ruimte met daglicht; op de achtergrond staan meer ezels met schilderijen."
  # Klein bijschrift onderin de foto. Leeg laten voor geen bijschrift.
  bijschrift: "Werk uit de retraite van 2025"

  # Proef in Daan opzet 1 en 2 (story 039): de hero als gekleurde band met
  # een kop, een subtekst en een fotocollage. Alleen zichtbaar in die twee
  # opzetten; in Vincent opzet 1 en 2 staan de gewone naam en slogan.
  # "kop" is een naam om uit te proberen; de echte naam staat in site.yaml.
  proef:
    kop: "StilteSmederij"
    subtekst: "Waar stilte, natuur en verbinding samenkomen tot een groter geheel"
    # De collage: bestandsnaam in src/images/, een kleinere versie (600 px)
    # voor telefoons, en een korte beschrijving voor wie hem niet kan zien.
    collage: "collage-editie-1.jpg"
    collageKlein: "collage-editie-1-klein.jpg"
    collageAlt: "Vijf foto's uit de retraite van 2025: een maaltijd aan een lange tafel in het bos, een ontbijt met een handgeschreven kaartje, geschilderde portretten op ezels, kaartjes met woorden van deelnemers, en twee mensen die samen een handpan bespelen."

ervaringen:
  # Kop boven de ervaringen van deelnemers. De quotes zelf staan in
  # src/_data/ervaringen.yaml.
  kop: "Wat deelnemers zeggen"

intro:
  # Het blok "Even uit de drukte" direct onder het landschap.
  # Elke regel met een streepje in "tekst" is een alinea.
  kop: "Even uit de drukte"
  tekst:
    - "Een paar dagen weg uit de drukte, in de natuur. Je maakt iets met je handen, mediteert en wandelt, en gebruikt wat je maakt om rustig naar binnen te kijken."
    - "Je hoeft niet te kunnen tekenen: het gaat om wat het maken met je doet, niet om het resultaat."

eerstvolgende:
  # Blok met de eerstvolgende retraite. Welke dat is, bepaalt de site zelf:
  # de eerste retraite in de toekomst.
  kop: "Eerstvolgende retraite"
  knop: "Vraag een plek aan"
  leeg: "Er staat op dit moment geen nieuwe retraite gepland."
  leegLink: "Laat het ons weten als je bericht wilt"
  # Link onder de kaart (alleen in Daan opzet 1 en 2, story 043)
  kalenderLink: "Alle retraites in de kalender"

routes:
  # Drie grote links onderaan de pagina.
  kop: "Verder kijken"
  lijst:
    - kop: "Over ons"
      tekst: "Wie we zijn, waar we voor staan en wat we aanbieden."
      url: "/over-ons/kennismaken/"
    - kop: "Kalender"
      tekst: "Alle retraites op een rij, per maand."
      url: "/kalender/"
    - kop: "Over de stichting"
      tekst: "Wie erachter zitten en waarom we dit doen."
      url: "/over-ons/stichting/"
