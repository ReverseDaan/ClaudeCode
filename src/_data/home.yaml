# ------------------------------------------------------------------
# Teksten van de homepagina, per blok van boven naar beneden.
# Pas de tekst tussen de aanhalingstekens aan; laat de namen
# vóór de dubbele punt (zoals "slogan:") staan.
# ------------------------------------------------------------------

hero:
  # Korte zin onder de naam, bovenaan de pagina.
  slogan: "Vertraag. Maak iets met je handen. Begin de reis naar binnen."
  knop: "Bekijk de retraites"
  # Foto voor de achtergrond: de bestandsnaam in src/images/.
  # Zolang het bestand er niet is, zie je een groene achtergrond.
  afbeelding: "hero-bos.jpg"
  # Korte beschrijving van de foto voor wie hem niet kan zien.
  alt: "Zonlicht valt tussen de bomen door in een rustig bos"

ervaringen:
  # Kop boven de ervaringen van deelnemers. De quotes zelf staan in
  # src/_data/ervaringen.yaml.
  kop: "Wat deelnemers zeggen"

intro:
  # Het ademblok direct onder het landschap. Eerst staat er "ademkop" met
  # een cirkel die drie keer in- en uitademt ("in" en "uit" staan in de
  # cirkel). Daarna verdwijnen die twee en verschijnt het gewone blok:
  # "kop" met de tekst en de knop "opnieuw".
  # Zonder animatie (of voor zoekmachines) staat er alleen "kop" met de tekst.
  # Elke regel met een streepje in "tekst" is een alinea.
  ademkop: "Adem kort met ons mee"
  kop: "Even uit de drukte"
  in: "in…"
  uit: "uit…"
  opnieuw: "Adem nog een keer"
  tekst:
    - "Een paar dagen weg uit de drukte, in de natuur. Je maakt iets met je handen, mediteert en wandelt, en gebruikt wat je maakt om rustig naar binnen te kijken."
    - "Je hoeft niet te kunnen tekenen: het gaat om wat het maken met je doet, niet om het resultaat."

stappen:
  # De drie stappen. "icoon" is een van: aankomen, creeren, reflecteren
  # (de tekeningen staan in src/_includes/partials/home-stappen.njk).
  kop: "Aankomen, creëren, reflecteren"
  lijst:
    - icoon: "aankomen"
      kop: "Aankomen"
      tekst: "Je telefoon gaat even weg, je komt tot stilstand in de natuur."
    - icoon: "creeren"
      kop: "Creëren"
      tekst: "Begeleid door een kunstenaar en zonder oordeel; het materiaal staat voor je klaar."
    - icoon: "reflecteren"
      kop: "Reflecteren"
      tekst: "In stilte, op papier of in de groep: wat zegt jouw werk over jou?"

eerstvolgende:
  # Blok met de eerstvolgende retraite. Welke dat is, bepaalt de site zelf:
  # de eerste retraite in de toekomst.
  kop: "Eerstvolgende retraite"
  knop: "Vraag een plek aan"
  leeg: "Er staat op dit moment geen nieuwe retraite gepland."
  leegLink: "Laat het ons weten als je bericht wilt"

routes:
  # Drie grote links onderaan de pagina.
  kop: "Verder kijken"
  lijst:
    - kop: "Over ons"
      tekst: "Wie we zijn, waar we voor staan en wat we aanbieden."
      url: "/over-ons/"
    - kop: "Kalender"
      tekst: "Alle retraites op een rij, per maand."
      url: "/kalender/"
    - kop: "Over de stichting"
      tekst: "Wie erachter zitten en waarom we dit doen."
      url: "/over-ons/stichting/"
