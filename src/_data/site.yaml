# ------------------------------------------------------------------
# Algemene gegevens van de website
# ------------------------------------------------------------------
# Dit bestand gebruikt YAML. Een paar regels:
#  - Regels die met # beginnen zijn commentaar en verschijnen niet op de site.
#  - Inspringen gebeurt met spaties, niet met tabs.
#  - Zet tekst met een dubbele punt (:) erin tussen "aanhalingstekens".
# ------------------------------------------------------------------

# De naam van de organisatie. Deze staat ALLEEN hier en wordt overal
# op de site automatisch ingevuld (logo, paginatitels, footer).
naam: "Stillness and Strokes"

# Het webadres van de site, zonder / aan het eind. Wordt gebruikt in de
# agenda-bestanden (links terug naar de site). Pas aan bij een eigen domein.
adres: "https://reversedaan.github.io/ClaudeCode"

# Korte omschrijving voor zoekmachines en bij het delen op social media.
omschrijving: "Retraites waarin je schildert en tekent als ingang om naar binnen te kijken en tot rust te komen. Geen ervaring nodig."

# Contactgegevens. Het e-mailadres is het gedeelde adres van de organisatie;
# telefoon en plaats zijn nog voorbeeldwaarden.
# In de voettekst staat alleen het e-mailadres; telefoon en plaats zijn
# voor later (bijv. de contactpagina).
contact:
  email: "stillnessandstrokes@gmail.com"
  telefoon: "06 12345678"
  plaats: "Veluwe, Nederland"

# "Houd me op de hoogte": een blok met een knop naar een Google Form in het
# gedeelde account, waar bezoekers hun e-mailadres kunnen achterlaten.
# Zolang "url" leeg is (""), staat het blok nergens op de site.
# Plak hier de link naar het formulier zodra het klaar is.
interesselijst:
  url: ""
  kop: "Houd me op de hoogte"
  tekst: "Nu geen tijd, maar wel nieuwsgierig? Laat je e-mailadres achter, dan laten we het je weten als er een nieuwe retraite is."
  knop: "Laat je e-mailadres achter"
  privacy: "We gebruiken je adres alleen om je te laten weten wanneer er een nieuwe retraite is. Afmelden kan altijd."

# Aanmeldformulier: een Google Form in het gedeelde account.
# Zolang "url" leeg is (""), opent de knop "Vraag een plek aan" een mail.
#  - url: de link naar het formulier (eindigt meestal op /viewform)
#  - retraiteVeld: de code van de vraag "Retraite" in het formulier,
#    bijv. "entry.123456789". Hiermee staat de gekozen retraite al ingevuld.
#    Hoe je die code vindt, staat in de README ("Aanmeldformulier koppelen").
# Een retraite kan ook een eigen formulier hebben: zet dan in het
# retraitebestand een "aanmeldlink". Die gaat voor.
aanmeldformulier:
  url: ""
  retraiteVeld: ""

# Links naar social media. Haal een regel weg als je een kanaal niet gebruikt.
social:
  - naam: "Instagram"
    url: "https://www.instagram.com/"
  - naam: "Facebook"
    url: "https://www.facebook.com/"

# Het hoofdmenu, in deze volgorde. "tekst" is wat in het menu staat.
menu:
  - tekst: "Home"
    url: "/"
  - tekst: "Wat en waarom"
    url: "/wat-en-waarom/"
  - tekst: "Retraites"
    url: "/retraites/"
  - tekst: "Kalender"
    url: "/kalender/"
  - tekst: "Aanmelden"
    url: "/aanmelden/"
  - tekst: "Over de stichting"
    url: "/stichting/"
  - tekst: "Contact"
    url: "/contact/"

# ------------------------------------------------------------------
# Stijlwisselaar (tijdelijk)
# ------------------------------------------------------------------
# Een knop rechtsonder op elke pagina om tussen huisstijlen te wisselen.
# Handig om stijlen te vergelijken; zet "aan" op false vóór de lancering.
# Staat hij uit, dan zie je altijd het eerste thema hieronder.
#
# Elk thema heeft:
#  - code: moet gelijk zijn aan de naam in style.css, bij [data-thema="..."]
#  - naam: de tekst in het keuzelijstje
# Het eerste thema is de standaard en heeft geen eigen blok in style.css.
stijlwisselaar:
  aan: true
  themas:
    - code: "bos"
      naam: "Bos"
    - code: "zand"
      naam: "Zand"
    - code: "groen-goud"
      naam: "Groen & goud"
    - code: "ochtend"
      naam: "Ochtend"
